# Checks Cargo.lock against the RustSec advisory database: on every change to the lock file and once a week
# (new advisories appear without any change here).
name: Audit

on:
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --deny warnings
