name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: .exe
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build (serial ports are on by default)
        run: cargo build --release --locked -p lightfoundry -p lightfoundry-cli
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/lightfoundry${{ matrix.ext }} target/release/lightfoundry-cli${{ matrix.ext }} dist/
          cp README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../lightfoundry-${{ matrix.name }}.zip . > /dev/null
          else
            tar czf ../lightfoundry-${{ matrix.name }}.tar.gz .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lightfoundry-${{ matrix.name }}
          path: lightfoundry-${{ matrix.name }}.*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lightfoundry-${{ matrix.name }}.*
