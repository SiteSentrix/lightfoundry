name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "The font library (public OFL fonts, served from this site and never fetched from elsewhere at run time)"
        uses: actions/checkout@v4
        with:
          repository: Stitchwright/stitchfoundry-fonts
          path: stitchfoundry-fonts
          sparse-checkout: fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the browser version
        run: sh apps/lightfoundry-web/build.sh
      - name: Assemble site
        run: |
          mkdir site
          cp apps/lightfoundry-web/index.html site/
          cp -r apps/lightfoundry-web/pkg site/pkg
          cargo run --locked -q -p xtask -- site-fonts stitchfoundry-fonts site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
