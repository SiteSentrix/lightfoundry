name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p lightfoundry -p lightfoundry-cli
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/lightfoundry.exe target/release/lightfoundry-cli.exe dist/ 2>/dev/null || cp target/release/lightfoundry*.exe dist/
          cp README.md LICENSE* dist/ 2>/dev/null || true
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: lightfoundry-windows-x64
          path: dist
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
