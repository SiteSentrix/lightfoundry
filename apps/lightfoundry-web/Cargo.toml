[package]
name = "lightfoundry-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightFoundry in the browser (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
lightfoundry-engine = { workspace = true }
lightfoundry-ui-egui = { workspace = true }
lightfoundry-device = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
log = { workspace = true }
